name: Nextcloud Mailcow reusable role

on:
  pull_request:
    paths:
      - 'roles/nextcloud-mailcow-provision/**'
      - '.github/workflows/nextcloud-mailcow-provision-ci.yml'
  push:
    paths:
      - 'roles/nextcloud-mailcow-provision/**'
      - '.github/workflows/nextcloud-mailcow-provision-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install role test dependencies
        run: |
          python3 -m pip install --user 'Jinja2>=3.1,<4' 'PyYAML>=6,<7' 'ansible-core>=2.18,<2.22'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Offline PHP tests, Jinja rendering, and Ansible syntax
        run: bash roles/nextcloud-mailcow-provision/tests/check.sh
