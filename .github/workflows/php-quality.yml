name: PHP quality and regression tests
on:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'src/**'
      - 'tests/Unit/**'
      - 'tests/Integration/**'
      - 'tests/Talk/**'
      - 'tests/nextcloud-talk/*.php'
      - 'scripts/*.php'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'psalm.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/php-quality.yml'
  push:
    branches: [main]
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'src/**'
      - 'tests/Unit/**'
      - 'tests/Integration/**'
      - 'tests/Talk/**'
      - 'tests/nextcloud-talk/*.php'
      - 'scripts/*.php'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'psalm.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/php-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Static analysis, coding style, and PHPUnit
        run: composer qa
