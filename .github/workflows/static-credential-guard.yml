name: Static credential guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prevent-static-credentials:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install autoloader
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check tracked files and intermediate commits without printing secret values
        env:
          SECRET_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check_secret_literals.php
