name: Static credential guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prevent-static-credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Check tracked files without displaying secret values
        run: python3 scripts/check_secret_literals.py
