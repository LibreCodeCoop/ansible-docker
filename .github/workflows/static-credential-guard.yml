name: Static credential guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prevent-static-credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests
        run: python3 -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Check tracked files and new commit blobs without displaying values
        env:
          SECRET_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_secret_literals.py
