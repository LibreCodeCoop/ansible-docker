name: Static credential guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  prevent-static-credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Credential regression tests
        run: vendor/bin/phpunit --testsuite Unit,Integration
      - name: Check tracked files and new commit blobs without displaying values
        env:
          SECRET_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check_secret_literals.php
