name: Nextcloud Talk HPB role
on:
  push:
    branches: [main]
    paths:
      - roles/nextcloud-talk/**
      - tests/nextcloud-talk/**
      - tests/Talk/**
      - composer.json
      - composer.lock
      - phpunit.xml.dist
      - .github/workflows/talk-hpb-ci.yml
  pull_request:
    paths:
      - roles/nextcloud-talk/**
      - tests/nextcloud-talk/**
      - tests/Talk/**
      - composer.json
      - composer.lock
      - phpunit.xml.dist
      - .github/workflows/talk-hpb-ci.yml
permissions:
  contents: read
jobs:
  validate-and-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ansible Core
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'ansible-core>=2.18,<2.22'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install locked PHP test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Ansible syntax and real isolated Janus/WebRTC integration
        env:
          RUN_HPB_INTEGRATION: '1'
        run: |
          . .venv/bin/activate
          export ANSIBLE_ROLES_PATH="$PWD/roles"
          ansible-playbook -i localhost, -c local --syntax-check tests/nextcloud-talk/render.yml
          composer test:talk
