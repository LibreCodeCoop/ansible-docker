---
- name: Validate supported Docker platforms
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Debian', 'Ubuntu', 'RedHat', 'Rocky', 'AlmaLinux']
      - ansible_architecture in ['x86_64', 'aarch64']
      - docker_group_users is sequence
      - docker_group_users is not string
      - docker_group_users | length == 0 or docker_manage_group_membership | bool
    fail_msg: Unsupported platform or group configuration; see roles/docker/README.md.

- name: Set Docker package architecture
  ansible.builtin.set_fact:
    docker_deb_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

- name: Install Debian repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Configure Docker's signed Debian repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ docker_deb_architecture }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    state: present
    enabled: true
  when: ansible_os_family == 'Debian'
  register: docker_repository_deb

- name: Configure Docker's signed RPM repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: true
    repo_gpgcheck: false
    gpgkey: https://download.docker.com/linux/centos/gpg
    enabled: true
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install Docker Engine and Compose plugin on Debian
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ 'latest' if docker_update_packages | bool else 'present' }}"
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install Docker Engine and Compose plugin on RPM systems
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: "{{ 'latest' if docker_update_packages | bool else 'present' }}"
    update_cache: true
  when: ansible_os_family == 'RedHat'

- name: Enable and start Docker Engine
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure Docker access group exists
  ansible.builtin.group:
    name: docker
    state: present
  when: docker_manage_group_membership | bool

- name: Authorize selected accounts to control Docker Engine
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_group_users }}"
  when: docker_manage_group_membership | bool
