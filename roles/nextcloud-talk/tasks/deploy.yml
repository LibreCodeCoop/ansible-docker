---
- name: Start or reconcile Talk HPB services without building images
  ansible.builtin.command:
    argv: >-
      {{
        ['docker', 'compose', '--project-directory', talk_project_dir,
         '-f', talk_project_dir ~ '/docker-compose.yml', 'up', '-d',
         '--no-build', '--pull', 'missing']
        + (['--force-recreate'] if (
          talk_general_templates.changed or talk_signaling_template.changed
          or (talk_turn_template.changed | default(false))
        ) else [])
      }}
  # Compose does not notice changed contents of bind-mounted config files.
  # Recreate the stack only when a rendered config actually changed.
  register: talk_compose_result
  changed_when: >-
    talk_compose_result.stderr is search('(?i)(Creating|Created|Recreating|Recreated|Starting|Started)')
