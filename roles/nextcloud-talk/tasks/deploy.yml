---
- name: Start or reconcile Talk HPB services without building images
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ talk_project_dir }}"
      - -f
      - "{{ talk_project_dir }}/docker-compose.yml"
      - up
      - -d
      - --no-build
      - --pull
      - missing
  register: talk_compose_result
  changed_when: >-
    talk_compose_result.stderr is search('(?i)(Creating|Created|Recreating|Recreated|Starting|Started)')
