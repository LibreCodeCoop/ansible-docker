---
- name: Validate standalone Talk HPB settings
  ansible.builtin.import_tasks: validate.yml
  when: talk_deploy_enabled | bool

- name: Render standalone Talk HPB configuration
  ansible.builtin.import_tasks: render.yml
  when: talk_deploy_enabled | bool

- name: Apply standalone Talk HPB deployment
  ansible.builtin.import_tasks: deploy.yml
  when:
    - talk_deploy_enabled | bool
    - talk_compose_up | bool
