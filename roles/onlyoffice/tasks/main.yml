---
- name: Verify Docker Engine and Compose v2 are installed
  ansible.builtin.command:
    cmd: docker compose version
  register: onlyoffice_compose_version
  changed_when: false
  when: onlyoffice_validate_prerequisites | bool

- name: Require a working Compose v2 installation
  ansible.builtin.assert:
    that:
      - onlyoffice_compose_version.rc == 0
    fail_msg: "Install the docker role before configuring OnlyOffice."
  when: onlyoffice_validate_prerequisites | bool
